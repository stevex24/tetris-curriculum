<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Adaptive Tetris Tutor — Learning from Play</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#10243b;--ink:#f5f8ff;--muted:#a9bad0;--cyan:#3de2ff;--orange:#ffb347;--green:#6ee7a0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#153251,var(--bg) 58%);color:var(--ink);font:15px/1.25 system-ui,sans-serif}header{text-align:center;padding:14px 16px 9px}h1{font-size:clamp(25px,3vw,40px);margin:0 0 3px;color:var(--cyan)}header p{margin:3px;color:var(--muted)}.integrity{display:inline-block;margin-top:6px;padding:5px 11px;border:1px solid var(--orange);border-radius:8px;color:var(--orange);font-weight:800}
    main{width:min(1500px,98vw);margin:auto}.panels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(7px,1vw,15px)}.panel{min-width:0;background:rgba(16,36,59,.84);border:2px solid #31506d;border-radius:12px;padding:clamp(7px,1vw,12px);text-align:center}.panel.done{border-color:var(--green)}h2{font-size:clamp(14px,1.35vw,20px);letter-spacing:.06em;margin:0;color:var(--ink)}.descriptor{height:34px;display:flex;align-items:center;justify-content:center;color:var(--cyan);font-size:clamp(11px,1vw,15px);font-weight:750}
    .board{width:min(100%,230px,calc((100vh - 245px)/2));aspect-ratio:1/2;margin:auto;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(20,1fr);gap:1px;padding:5px;background:#030810;border:2px solid #527796;border-radius:7px}.cell{min-width:0;min-height:0;background:#0b1726;border-radius:1px}.cell.on{background:linear-gradient(135deg,#55e6ff,#2583d8);box-shadow:inset 0 0 0 1px #a8f5ff}.board.clear{animation:flash .16s alternate 2}@keyframes flash{to{border-color:#fff;background:#6a5420}}
    .stats{margin:7px auto 0;display:grid;gap:1px;font-size:clamp(12px,1.05vw,16px)}.stats b{font-size:1.12em}.status{min-height:32px;display:flex;align-items:center;justify-content:center;margin-top:3px;font-weight:850;color:var(--green);font-size:clamp(11px,.95vw,14px)}.controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 5px}button{font:inherit;font-weight:750;color:var(--ink);background:#183957;border:1px solid #4d718f;border-radius:8px;padding:6px 13px;cursor:pointer}button:hover{border-color:var(--cyan);background:#256187}.step{color:var(--muted);min-width:120px}.provenance{text-align:center;color:var(--muted);font-size:12px;margin:5px 0 12px}
    @media(max-width:900px){body{font-size:13px}.panels{gap:5px}.panel{padding:6px}.descriptor{height:40px}.board{padding:3px}.status{min-height:42px}}
    @media(max-width:650px){.panels{grid-template-columns:repeat(2,minmax(0,1fr))}.board{width:min(170px,100%)}header{padding-top:9px}}
  </style>
</head>
<body>
  <header><h1>Adaptive Tetris Tutor — Learning from Play</h1><p>Same test, different amounts of prior training, plus the fixed reference oracle</p><div class="integrity">Same held-out piece sequence for all four boards. Learning is OFF during this replay.</div></header>
  <main><div id="panels" class="panels"></div><div class="controls"><button id="start">▶ Start</button><button id="pause">Ⅱ Pause</button><button id="replay">↺ Replay</button><span id="step" class="step"></span></div><div id="provenance" class="provenance"></div></main>
  <script src="day4_rl_oracle_comparison.js"></script>
</body>
</html>
