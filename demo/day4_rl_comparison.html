<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Adaptive Tetris Tutor — Learning from Play</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#10243b;--ink:#f5f8ff;--muted:#a9bad0;--cyan:#3de2ff;--orange:#ffb347;--green:#6ee7a0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#153251,var(--bg) 58%);color:var(--ink);font:17px/1.3 system-ui,sans-serif}
    header{text-align:center;padding:22px 20px 12px}h1{font-size:clamp(28px,4vw,48px);margin:0 0 5px;color:var(--cyan)}header p{margin:4px;color:var(--muted)}.off{display:inline-block;margin-top:8px;padding:6px 12px;border:1px solid var(--orange);border-radius:8px;color:var(--orange);font-weight:800}
    main{width:min(1240px,96vw);margin:auto}.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.panel{background:rgba(16,36,59,.84);border:2px solid #31506d;border-radius:14px;padding:14px;text-align:center}.panel.done{border-color:var(--green)}h2{font-size:22px;margin:0;color:var(--ink)}.exposure{color:var(--cyan);font-weight:750;margin:4px 0 10px}
    .board{width:min(100%,260px);aspect-ratio:1/2;margin:auto;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(20,1fr);gap:2px;padding:7px;background:#030810;border:2px solid #527796;border-radius:8px}.cell{background:#0b1726;border-radius:2px}.cell.on{background:linear-gradient(135deg,#55e6ff,#2583d8);box-shadow:inset 0 0 0 1px #a8f5ff}.board.clear{animation:flash .16s alternate 2}@keyframes flash{to{border-color:#fff;background:#6a5420}}
    .stats{display:flex;justify-content:center;gap:26px;margin-top:9px}.stats b{font-size:22px}.piece{height:22px;color:var(--muted);margin-top:4px}.status{min-height:24px;margin-top:5px;font-weight:850;color:var(--green)}
    .controls{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin:17px 0}button{font:inherit;font-weight:750;color:var(--ink);background:#183957;border:1px solid #4d718f;border-radius:9px;padding:8px 15px;cursor:pointer}button:hover{border-color:var(--cyan);background:#256187}.step{color:var(--muted);min-width:120px;text-align:center}.provenance{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 18px}
    @media(max-width:760px){.panels{grid-template-columns:1fr}.board{width:210px}header{padding-top:14px}}
  </style>
</head>
<body>
  <header><h1>Adaptive Tetris Tutor — Learning from Play</h1><p>Same student architecture, same held-out piece sequence, different amounts of prior RL training</p><div class="off">Learning is OFF during this replay</div></header>
  <main><div id="panels" class="panels"></div><div class="controls"><button id="start">▶ Start</button><button id="pause">Ⅱ Pause</button><button id="replay">↺ Replay</button><button id="next">Next placement</button><span id="step" class="step"></span></div><div id="provenance" class="provenance"></div></main>
  <script src="day4_rl_comparison.js"></script>
</body>
</html>
