<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phase 2 Adaptive Tetris Tutor</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#10243b;--ink:#f5f8ff;--muted:#a9bad0;--cyan:#3de2ff;--orange:#ffb347;--green:#6ee7a0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#153251,var(--bg) 58%);color:var(--ink);font:15px/1.25 system-ui,sans-serif}header{text-align:center;padding:16px 16px 10px}h1{font-size:clamp(25px,3vw,40px);margin:0 0 3px;color:var(--cyan)}header p{margin:3px;color:var(--muted)}.integrity{display:inline-block;margin-top:7px;padding:6px 11px;border:1px solid var(--orange);border-radius:8px;color:var(--orange);font-weight:800}main{width:min(1500px,98vw);margin:auto}.panels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(7px,1vw,15px)}.panel{min-width:0;background:rgba(16,36,59,.84);border:2px solid #31506d;border-radius:12px;padding:clamp(7px,1vw,12px);text-align:center}.panel.done{border-color:var(--green)}h2{font-size:clamp(14px,1.35vw,20px);letter-spacing:.04em;margin:0;color:var(--ink)}.descriptor{height:38px;display:flex;align-items:center;justify-content:center;color:var(--cyan);font-size:clamp(10px,1vw,14px);font-weight:750}.rating{color:var(--muted);font-size:12px;min-height:17px}.board{width:min(100%,230px,calc((100vh - 270px)/2));aspect-ratio:1/2;margin:7px auto;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(20,1fr);gap:1px;padding:5px;background:#030810;border:2px solid #527796;border-radius:7px}.cell{min-width:0;min-height:0;background:#0b1726;border-radius:1px}.cell.on{background:linear-gradient(135deg,#55e6ff,#2583d8);box-shadow:inset 0 0 0 1px #a8f5ff}.board.clear{animation:flash .16s alternate 2}@keyframes flash{to{border-color:#fff;background:#6a5420}}.stats{margin:7px auto 0;display:grid;gap:2px;font-size:clamp(12px,1.05vw,16px)}.stats b{font-size:1.12em}.status{min-height:32px;display:flex;align-items:center;justify-content:center;margin-top:4px;font-weight:850;color:var(--green);font-size:clamp(11px,.95vw,14px)}.controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:11px 0 5px}button{font:inherit;font-weight:750;color:var(--ink);background:#183957;border:1px solid #4d718f;border-radius:8px;padding:7px 13px;cursor:pointer}button:hover{border-color:var(--cyan);background:#256187}.step{color:var(--muted);min-width:130px;text-align:center}.provenance{text-align:center;color:var(--muted);font-size:12px;margin:5px 0 12px}@media(max-width:900px){.panels{gap:5px}.panel{padding:6px}.descriptor{height:48px}.board{padding:3px}}@media(max-width:650px){.panels{grid-template-columns:repeat(2,minmax(0,1fr))}.board{width:min(170px,100%)}header{padding-top:10px}}
  </style>
</head>
<body>
  <header><h1>Phase 2 Adaptive Tetris Tutor</h1><p>Four frozen policies, replayed side by side</p><div class="integrity">Same held-out piece stream · learning disabled · no cherry-picked seed</div></header>
  <main><div id="panels" class="panels"><p>Loading frozen replay…</p></div><div class="controls"><button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="restart">↺ Restart</button><button id="step">Next step</button><span id="position" class="step"></span></div><div id="provenance" class="provenance"></div></main>
  <script src="phase2-comparison.js"></script>
</body>
</html>
